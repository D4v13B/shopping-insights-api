name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.11
  UV_VERSION: 0.8.13
  # La integración necesita datos cargados por el ETL. Si el repo es privado, crear el secreto
  # CROSS_REPO_TOKEN con permiso de lectura sobre él.
  ETL_REPO: ${{ github.repository_owner }}/shopping-insights-etl

jobs:
  lint:
    name: Lint, tipos y contrato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bun run lint
      - name: TypeScript
        run: bun run typecheck
      - name: El contrato versionado coincide con el código
        run: |
          bun run gen:api
          git diff --exit-code -- openapi.json || (echo "::error::Ejecuta 'bun run gen:api' y versiona openapi.json" && exit 1)

  test:
    name: bun test (unitarios + integración)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: shopping
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d shopping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: shopping
      ETL_DB_PASSWORD: etl-ci-password
      API_DB_PASSWORD: api-ci-password
      DATABASE_URL_MIGRATE: postgresql://postgres:postgres@localhost:5432/shopping
      DATABASE_URL_ETL: postgresql://etl_writer:etl-ci-password@localhost:5432/shopping
      TEST_DATABASE_URL_ADMIN: postgresql://postgres:postgres@localhost:5432/shopping
      TEST_DATABASE_URL_API: postgresql://api_reader:api-ci-password@localhost:5432/shopping
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ETL_REPO }}
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: .etl
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "${{ env.BUN_VERSION }}" }
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: bun install --frozen-lockfile
      - name: Roles y migraciones (el mismo script que usa Docker)
        run: |
          bash infra/postgres/init-roles.sh
          bun run db:migrate
      - name: Cargar datos con el ETL
        working-directory: .etl
        run: |
          uv sync --frozen --no-dev
          uv run shopping-etl run
      - name: bun test con cobertura
        run: bun test --coverage

  docker:
    name: Build de la imagen
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shopping-insights-api .
